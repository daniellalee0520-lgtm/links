<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<meta name="theme-color" content="#ffffff">

<title>我的链接收藏</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#172033;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:16px 16px 90px;
}


/* =========================
   顶部
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.title{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.5px;
}

.subtitle{
  margin-top:3px;
  color:#8b929d;
  font-size:12px;
}

.settings-btn{
  width:40px;
  height:40px;
  border:1px solid #e0e4ea;
  border-radius:50%;
  background:white;
  font-size:18px;
}


/* =========================
   统计
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:13px;
}

.stat{
  background:white;
  border:1px solid #e1e5eb;
  border-radius:14px;
  padding:12px;
}

.stat-number{
  font-size:23px;
  font-weight:800;
}

.stat-label{
  margin-top:3px;
  color:#858d99;
  font-size:11px;
}

.stat.valid .stat-number{
  color:#159447;
}

.stat.invalid .stat-number{
  color:#d83232;
}

.stat.unknown .stat-number{
  color:#c37b00;
}


/* =========================
   搜索
========================= */

.search{
  display:flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #dfe4ea;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:9px;
}

.search-icon{
  font-size:15px;
}

.search input{
  width:100%;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  font-size:14px;
}


/* =========================
   筛选
========================= */

.filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.filters select{
  width:100%;
  border:1px solid #dfe4ea;
  border-radius:10px;
  padding:9px;
  background:white;
  color:#3e4755;
  outline:none;
  font-size:13px;
}


/* =========================
   工具栏
========================= */

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.toolbar button{
  border:1px solid #dce1e8;
  border-radius:10px;
  background:white;
  color:#2474d6;
  padding:8px 12px;
  font-size:13px;
  font-weight:600;
}


/* =========================
   标签栏
========================= */

.tags-filter{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:7px;
  margin-bottom:8px;
}

.tags-filter::-webkit-scrollbar{
  display:none;
}

.tag-filter{
  flex-shrink:0;
  border:1px solid #dce2e9;
  border-radius:18px;
  background:white;
  color:#657080;
  padding:6px 11px;
  font-size:12px;
}

.tag-filter.active{
  background:#111827;
  border-color:#111827;
  color:white;
}


/* =========================
   链接卡片
========================= */

.link-card{
  background:white;
  border:1px solid #e0e5eb;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.card-main{
  min-width:0;
}

.link-title{
  font-size:18px;
  font-weight:750;
  line-height:1.3;
  word-break:break-word;
}

.link-url{
  margin-top:5px;
  color:#2a73d6;
  font-size:12px;
  line-height:1.45;
  word-break:break-all;
}

.status{
  flex-shrink:0;
  padding:5px 9px;
  border-radius:15px;
  font-size:11px;
  font-weight:700;
}

.status-valid{
  color:#13823f;
  background:#e8f7ed;
}

.status-invalid{
  color:#d12c2c;
  background:#ffe8e8;
}

.status-unknown{
  color:#b36d00;
  background:#fff2d9;
}

.status-unchecked{
  color:#69717d;
  background:#eef0f3;
}


/* =========================
   标签
========================= */

.card-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}

.tag{
  display:inline-flex;
  align-items:center;
  border-radius:15px;
  background:#eef4ff;
  color:#326cc0;
  padding:5px 9px;
  font-size:11px;
  font-weight:600;
}


/* =========================
   备注
========================= */

.note{
  margin-top:9px;
  padding:9px 10px;
  border-radius:10px;
  background:#f7f8fa;
  color:#687282;
  font-size:12px;
  line-height:1.55;
  white-space:pre-wrap;
}


/* =========================
   时间
========================= */

.updated{
  margin-top:8px;
  color:#a0a7b1;
  font-size:10px;
}


/* =========================
   操作
========================= */

.actions{
  display:flex;
  gap:7px;
  margin-top:11px;
}

.actions button{
  flex:1;
  min-width:0;
  border:1px solid #dce1e8;
  border-radius:10px;
  background:white;
  color:#2474d6;
  padding:8px 7px;
  font-size:12px;
  font-weight:650;
}

.actions button.delete{
  color:#d52e2e;
}

.actions button.open{
  background:#111827;
  color:white;
  border-color:#111827;
}


/* =========================
   空状态
========================= */

.empty{
  background:white;
  border:1px solid #e0e5eb;
  border-radius:16px;
  text-align:center;
  padding:45px 20px;
  color:#858e9b;
}

.empty-icon{
  font-size:36px;
  margin-bottom:8px;
}

.empty small{
  display:block;
  margin-top:5px;
  color:#a2a8b1;
}


/* =========================
   浮动添加按钮
========================= */

.add-btn{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  border:0;
  border-radius:30px;
  background:#111827;
  color:white;
  padding:13px 23px;
  font-size:15px;
  font-weight:750;
  box-shadow:0 7px 25px rgba(0,0,0,.2);
}


/* =========================
   弹窗
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.4);
}

.modal.show{
  display:flex;
}

.modal-content{
  width:100%;
  max-width:650px;
  max-height:92vh;
  overflow:auto;
  padding:18px 17px 30px;
  background:white;
  border-radius:20px 20px 0 0;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-header h2{
  margin:0;
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f0f2f5;
  font-size:22px;
}


/* =========================
   表单
========================= */

.form-label{
  display:block;
  margin-bottom:12px;
  color:#4f5967;
  font-size:12px;
  font-weight:650;
}

.form-label input,
.form-label textarea{
  width:100%;
  margin-top:5px;
  padding:10px;
  border:1px solid #dfe4ea;
  border-radius:10px;
  background:#fafbfc;
  outline:none;
  color:#172033;
  font-size:14px;
}

.form-label textarea{
  resize:vertical;
  min-height:80px;
}

.form-label input:focus,
.form-label textarea:focus{
  background:white;
  border-color:#9ab8dc;
}


/* =========================
   标签输入
========================= */

.tags-input-box{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  min-height:44px;
  margin-top:5px;
  padding:7px;
  border:1px solid #dfe4ea;
  border-radius:10px;
  background:#fafbfc;
}

.selected-tag{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 8px;
  border-radius:14px;
  background:#eaf2ff;
  color:#2d6fc7;
  font-size:12px;
}

.selected-tag button{
  border:0;
  padding:0;
  background:none;
  color:#52719a;
  font-size:13px;
}

.tag-input{
  flex:1;
  min-width:120px;
  border:0 !important;
  margin:0 !important;
  padding:5px !important;
  background:transparent !important;
}


/* =========================
   常用标签
========================= */

.common-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}

.common-tags button{
  border:1px solid #dfe4ea;
  border-radius:14px;
  background:white;
  color:#657080;
  padding:5px 9px;
  font-size:11px;
}


/* =========================
   保存
========================= */

.save-btn{
  width:100%;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  padding:12px;
  font-size:14px;
  font-weight:750;
}


/* =========================
   手机
========================= */

@media(max-width:650px){

  .app{
    padding:
      12px
      12px
      85px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .filters select:last-child{
    grid-column:span 2;
  }

  .link-title{
    font-size:17px;
  }

  .actions button{
    font-size:11px;
  }

}

@media(max-width:380px){

  .app{
    padding-left:9px;
    padding-right:9px;
  }

  .title{
    font-size:22px;
  }

  .link-card{
    padding:13px;
  }

  .actions{
    gap:5px;
  }

  .actions button{
    padding-left:4px;
    padding-right:4px;
  }

}

</style>
</head>


<body>

<div class="app">

  <!-- ======================
       顶部
  ======================= -->

  <header class="topbar">

    <div>

      <div class="title">
        🔗 我的链接收藏
      </div>

      <div class="subtitle">
        Link Bookmark Manager
      </div>

    </div>

    <button
      class="settings-btn"
      onclick="openSettings()"
    >
      ⚙️
    </button>

  </header>


  <!-- ======================
       统计
  ======================= -->

  <section class="stats">

    <div class="stat">

      <div
        class="stat-number"
        id="totalCount"
      >
        0
      </div>

      <div class="stat-label">
        全部链接
      </div>

    </div>


    <div class="stat valid">

      <div
        class="stat-number"
        id="validCount"
      >
        0
      </div>

      <div class="stat-label">
        有效
      </div>

    </div>


    <div class="stat invalid">

      <div
        class="stat-number"
        id="invalidCount"
      >
        0
      </div>

      <div class="stat-label">
        失效
      </div>

    </div>


    <div class="stat unknown">

      <div
        class="stat-number"
        id="unknownCount"
      >
        0
      </div>

      <div class="stat-label">
        无法检测
      </div>

    </div>

  </section>


  <!-- ======================
       搜索
  ======================= -->

  <div class="search">

    <span class="search-icon">
      🔎
    </span>

    <input
      id="searchInput"
      type="search"
      placeholder="搜索标题、网址、备注……"
      oninput="render()"
    >

  </div>


  <!-- ======================
       标签筛选
  ======================= -->

  <div
    class="tags-filter"
    id="tagsFilter"
  ></div>


  <!-- ======================
       筛选
  ======================= -->

  <section class="filters">

    <select
      id="statusFilter"
      onchange="render()"
    >

      <option value="all">
        全部状态
      </option>

      <option value="valid">
        🟢 有效
      </option>

      <option value="invalid">
        🔴 失效
      </option>

      <option value="unknown">
        🟠 无法检测
      </option>

      <option value="unchecked">
        ⚪ 未检测
      </option>

    </select>


    <select
      id="sortFilter"
      onchange="render()"
    >

      <option value="new">
        最近添加
      </option>

      <option value="old">
        最早添加
      </option>

      <option value="name">
        名称
      </option>

      <option value="status">
        状态
      </option>

    </select>


    <select
      id="tagFilterSelect"
      onchange="changeTagFromSelect()"
    >

      <option value="all">
        全部标签
      </option>

    </select>

  </section>


  <!-- ======================
       工具
  ======================= -->

  <section class="toolbar">

    <button onclick="openAddModal()">
      ＋ 添加链接
    </button>

    <button onclick="checkAllLinks()">
      🔄 检测全部
    </button>

    <button onclick="exportExcel()">
      📤 Excel导出
    </button>

    <button onclick="document.getElementById('excelInput').click()">
      📥 Excel导入
    </button>

    <button onclick="exportJSON()">
      💾 JSON备份
    </button>

    <button onclick="document.getElementById('jsonInput').click()">
      📂 JSON恢复
    </button>

    <input
      id="excelInput"
      type="file"
      accept=".xlsx,.xls"
      hidden
      onchange="importExcel(event)"
    >

    <input
      id="jsonInput"
      type="file"
      accept=".json"
      hidden
      onchange="importJSON(event)"
    >

  </section>


  <!-- ======================
       链接列表
  ======================= -->

  <main id="linkList"></main>

</div>


<!-- ======================
     添加 / 编辑
======================= -->

<div
  class="modal"
  id="linkModal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="modalTitle">
        添加链接
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <form onsubmit="saveLink(event)">

      <input
        id="editId"
        type="hidden"
      >


      <label class="form-label">

        链接标题 *

        <input
          id="linkTitle"
          required
          placeholder="例如：ChatGPT"
        >

      </label>


      <label class="form-label">

        链接网址 *

        <input
          id="linkUrl"
          type="url"
          required
          placeholder="https://example.com"
        >

      </label>


      <label class="form-label">

        标签

        <div
          class="tags-input-box"
          id="selectedTags"
        >

          <input
            id="tagInput"
            class="tag-input"
            placeholder="输入标签后按回车"
            onkeydown="handleTagInput(event)"
          >

        </div>


        <div
          class="common-tags"
          id="commonTags"
        ></div>

      </label>


      <label class="form-label">

        备注

        <textarea
          id="linkNote"
          placeholder="记录这个网站是做什么的……"
        ></textarea>

      </label>


      <button
        class="save-btn"
        type="submit"
      >
        保存链接
      </button>

    </form>

  </div>

</div>


<!-- ======================
     设置
======================= -->

<div
  class="modal"
  id="settingsModal"
>

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        设置
      </h2>

      <button
        class="close"
        onclick="closeSettings()"
      >
        ×
      </button>

    </div>


    <p
      style="
        color:#687282;
        font-size:13px;
        line-height:1.6;
      "
    >
      链接数据默认保存在当前浏览器的 LocalStorage。
      如果更换设备或浏览器，请使用 JSON 备份功能。
    </p>


    <button
      class="save-btn"
      onclick="clearAllData()"
    >
      清空全部链接
    </button>

  </div>

</div>


<script>

/* =========================================================
   数据
========================================================= */

const STORAGE_KEY =
  "my-link-bookmarks-v1";

let links = [];

let activeTag = "all";

let selectedTags = [];


/* =========================================================
   初始化
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadData();

    render();

  }
);


/* =========================================================
   基础工具
========================================================= */

function generateId(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function escapeJS(value){

  return String(value ?? "")

    .replace(/\\/g,"\\\\")

    .replace(/'/g,"\\'");

}


/* =========================================================
   数据存储
========================================================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved){

      links = [];

      return;

    }


    const data =
      JSON.parse(saved);


    if(!Array.isArray(data)){

      links = [];

      return;

    }


    links =
      data.map(
        item => normalizeLink(item)
      );

  }catch(error){

    console.error(
      "读取数据失败",
      error
    );

    links = [];

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(links)
  );

}


function normalizeLink(item){

  return {

    id:
      item.id ||
      generateId(),

    title:
      item.title ||
      "未命名链接",

    url:
      item.url ||
      "",

    tags:
      Array.isArray(item.tags)
        ? item.tags
        : [],

    note:
      item.note ||
      "",

    status:
      item.status ||
      "unchecked",

    lastChecked:
      item.lastChecked ||
      "",

    statusMessage:
      item.statusMessage ||
      "",

    createdAt:
      item.createdAt ||
      Date.now(),

    updatedAt:
      item.updatedAt ||
      item.createdAt ||
      Date.now()

  };

}


/* =========================================================
   URL处理
========================================================= */

function normalizeUrl(url){

  let value =
    String(url || "")
      .trim();


  if(!value){

    return "";

  }


  if(
    !/^https?:\/\//i.test(value)
  ){

    value =
      "https://" +
      value;

  }


  return value;

}


/* =========================================================
   添加 / 编辑
========================================================= */

function openAddModal(){

  document.getElementById(
    "modalTitle"
  ).textContent =
    "添加链接";


  document.getElementById(
    "editId"
  ).value =
    "";


  document.getElementById(
    "linkTitle"
  ).value =
    "";


  document.getElementById(
    "linkUrl"
  ).value =
    "";


  document.getElementById(
    "linkNote"
  ).value =
    "";


  selectedTags = [];


  renderSelectedTags();

  renderCommonTags();


  document.getElementById(
    "linkModal"
  ).classList.add("show");

}


function openEditModal(id){

  const item =
    links.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!item){

    return;

  }


  document.getElementById(
    "modalTitle"
  ).textContent =
    "编辑链接";


  document.getElementById(
    "editId"
  ).value =
    item.id;


  document.getElementById(
    "linkTitle"
  ).value =
    item.title;


  document.getElementById(
    "linkUrl"
  ).value =
    item.url;


  document.getElementById(
    "linkNote"
  ).value =
    item.note;


  selectedTags =
    [...item.tags];


  renderSelectedTags();

  renderCommonTags();


  document.getElementById(
    "linkModal"
  ).classList.add("show");

}


function closeModal(){

  document.getElementById(
    "linkModal"
  ).classList.remove("show");

}


function saveLink(event){

  event.preventDefault();


  const id =
    document.getElementById(
      "editId"
    ).value;


  const title =
    document.getElementById(
      "linkTitle"
    ).value.trim();


  const url =
    normalizeUrl(
      document.getElementById(
        "linkUrl"
      ).value
    );


  const note =
    document.getElementById(
      "linkNote"
    ).value.trim();


  if(!title){

    alert(
      "请输入链接标题。"
    );

    return;

  }


  if(!url){

    alert(
      "请输入链接网址。"
    );

    return;

  }


  if(id){

    const index =
      links.findIndex(
        item =>
          String(item.id) ===
          String(id)
      );


    if(index !== -1){

      links[index] = {

        ...links[index],

        title,

        url,

        tags:
          [...selectedTags],

        note,

        updatedAt:
          Date.now()

      };

    }

  }else{

    links.unshift({

      id:
        generateId(),

      title,

      url,

      tags:
        [...selectedTags],

      note,

      status:
        "unchecked",

      lastChecked:
        "",

      statusMessage:
        "",

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    });

  }


  saveData();

  closeModal();

  render();

}


/* =========================================================
   标签
========================================================= */

function handleTagInput(event){

  if(
    event.key ===
    "Enter"
  ){

    event.preventDefault();

    addTagFromInput();

  }


  if(
    event.key ===
    "," ||
    event.key ===
    "，"
  ){

    event.preventDefault();

    addTagFromInput();

  }

}


function addTagFromInput(){

  const input =
    document.getElementById(
      "tagInput"
    );


  const tag =
    input.value
      .trim()
      .replace(/^#/,"");


  if(!tag){

    return;

  }


  if(
    !selectedTags.includes(
      tag
    )
  ){

    selectedTags.push(
      tag
    );

  }


  input.value =
    "";


  renderSelectedTags();

  renderCommonTags();

}


function removeTag(tag){

  selectedTags =
    selectedTags.filter(
      item =>
        item !== tag
    );


  renderSelectedTags();

}


function addCommonTag(tag){

  if(
    !selectedTags.includes(
      tag
    )
  ){

    selectedTags.push(
      tag
    );

  }


  renderSelectedTags();

}


function renderSelectedTags(){

  const box =
    document.getElementById(
      "selectedTags"
    );


  const input =
    document.getElementById(
      "tagInput"
    );


  box.innerHTML = "";


  selectedTags.forEach(
    tag => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "selected-tag";


      div.innerHTML = `

        <span>
          ${escapeHTML(tag)}
        </span>

        <button
          type="button"
          onclick="removeTag('${escapeJS(tag)}')"
        >
          ×
        </button>

      `;


      box.appendChild(
        div
      );

    }
  );


  box.appendChild(
    input
  );

}


function getAllTags(){

  const set =
    new Set();


  links.forEach(
    item => {

      item.tags.forEach(
        tag =>
          set.add(tag)
      );

    }
  );


  return [...set].sort(
    (a,b) =>
      a.localeCompare(
        b,
        "zh"
      )
  );

}


function renderCommonTags(){

  const box =
    document.getElementById(
      "commonTags"
    );


  const tags =
    getAllTags();


  if(!tags.length){

    box.innerHTML = "";

    return;

  }


  box.innerHTML =
    tags

      .map(
        tag => `

          <button
            type="button"
            onclick="addCommonTag('${escapeJS(tag)}')"

          </button>

      )

      .join("");

/* =========================================================
   筛选
========================================================= */

function getFilteredLinks(){

  let result =
    [...links];


  const keyword =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  if(keyword){

    result =
      result.filter(
        item =>

          [

            item.title,

            item.url,

            item.note,

            item.tags.join(" ")

          ]

            .join(" ")

            .toLowerCase()

            .includes(
              keyword
            )

      );

  }


  if(
    activeTag !==
    "all"
  ){

    result =
      result.filter(
        item =>
          item.tags.includes(
            activeTag
          )
      );

  }


  const status =
    document.getElementById(
      "statusFilter"
    ).value;


  if(status !== "all"){

    result =
      result.filter(
        item =>
          item.status ===
          status
      );

  }


  const sort =
    document.getElementById(
      "sortFilter"
    ).value;


  if(sort === "new"){

    result.sort(
      (a,b) =>
        b.createdAt -
        a.createdAt
    );

  }


  else if(
    sort === "old"
  ){

    result.sort(
      (a,b) =>
        a.createdAt -
        b.createdAt
    );

  }


  else if(
    sort === "name"
  ){

    result.sort(
      (a,b) =>
        a.title.localeCompare(
          b.title,
          "zh"
        )
    );

  }


  else if(
    sort === "status"
  ){

    const order = {

      invalid:0,

      unknown:1,

      unchecked:2,

      valid:3

    };


    result.sort(
      (a,b) =>
        (
          order[a.status] ??
          99
        ) -

        (
          order[b.status] ??
          99
        )
    );

  }


  return result;

}

/* =========================================================
   链接检测
========================================================= */

/*
  注意：

  浏览器不能可靠地读取所有第三方网站的 HTTP 状态。
  很多网站会因为 CORS、Cloudflare、登录限制等原因无法检测。

  因此：

  200~399
      → 有效

  明确收到 404 / 410 等
      → 失效

  网络错误 / CORS
      → 无法检测

*/


async function checkLink(id){

  const item =
    links.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!item){

    return;

  }


  item.status =
    "unknown";


  item.statusMessage =
    "正在检测……";


  render();

  saveData();


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () =>
          controller.abort(),
        10000
      );


    let response;


    try{

      response =
        await fetch(
          item.url,
          {

            method:
              "HEAD",

            mode:
              "cors",

            cache:
              "no-store",

            signal:
              controller.signal

          }
        );

    }catch(error){

      /*
        HEAD 被拒绝时尝试 GET
      */

      response =
        await fetch(
          item.url,
          {

            method:
              "GET",

            mode:
              "cors",

            cache:
              "no-store",

            signal:
              controller.signal

          }
        );

    }


    clearTimeout(
      timeout
    );


    const status =
      response.status;


    item.lastChecked =
      new Date().toLocaleString(
        "zh-CN"
      );


    if(
      status >= 200 &&
      status < 400
    ){

      item.status =
        "valid";

      item.statusMessage =
        `HTTP ${status}`;

    }

    else if(
      status === 404 ||
      status === 410
    ){

      item.status =
        "invalid";

      item.statusMessage =
        `HTTP ${status}：页面不存在或已删除`;

    }

    else if(
      status >= 400
    ){

      item.status =
        "unknown";

      item.statusMessage =
        `HTTP ${status}：服务器拒绝或需要权限`;

    }

    else{

      item.status =
        "unknown";

      item.statusMessage =
        `HTTP ${status}`;

    }


  }catch(error){

    item.lastChecked =
      new Date().toLocaleString(
        "zh-CN"
      );


    item.status =
      "unknown";


    if(
      error.name ===
      "AbortError"
    ){

      item.statusMessage =
        "检测超时";

    }

    else{

      item.statusMessage =
        "浏览器无法访问该网站，可能受到 CORS 或网站安全策略限制";

    }

  }


  saveData();

  render();

}


/* =========================================================
   批量检测
========================================================= */

async function checkAllLinks(){

  if(!links.length){

    alert(
      "目前没有链接。"
    );

    return;

  }


  if(
    !confirm(
      `确定检测全部 ${links.length} 个链接吗？\n\n检测过程中请不要关闭页面。`
    )
  ){

    return;

  }


  for(
    let i = 0;
    i < links.length;
    i++
  ){

    const item =
      links[i];


    item.status =
      "unknown";


    item.statusMessage =
      `正在检测 ${i + 1} / ${links.length}`;


    render();


    try{

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          8000
        );


      let response;


      try{

        response =
          await fetch(
            item.url,
            {

              method:
                "HEAD",

              mode:
                "cors",

              cache:
                "no-store",

              signal:
                controller.signal

            }
          );

      }catch(error){

        response =
          await fetch(
            item.url,
            {

              method:
                "GET",

              mode:
                "cors",

              cache:
                "no-store",

              signal:
                controller.signal

            }
          );

      }


      clearTimeout(
        timeout
      );


      if(
        response.status >= 200 &&
        response.status < 400
      ){

        item.status =
          "valid";

        item.statusMessage =
          `HTTP ${response.status}`;

      }

      else if(
        response.status === 404 ||
        response.status === 410
      ){

        item.status =
          "invalid";

        item.statusMessage =
          `HTTP ${response.status}：页面不存在或已删除`;

      }

      else{

        item.status =
          "unknown";

        item.statusMessage =
          `HTTP ${response.status}`;

      }


    }catch(error){

      item.status =
        "unknown";

      item.statusMessage =
        error.name ===
        "AbortError"

          ? "检测超时"

          : "无法检测：可能受到 CORS 或网站安全策略限制";

    }


    item.lastChecked =
      new Date().toLocaleString(
        "zh-CN"
      );


    saveData();

    render();


    /*
      避免连续请求太快
    */

    await sleep(
      300
    );

  }


  alert(
    "全部链接检测完成。"
  );

}


function sleep(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   Excel 导出
========================================================= */

function exportExcel(){

  if(
    typeof XLSX ===
    "undefined"
  ){

    alert(
      "Excel组件加载失败，请检查网络连接。"
    );

    return;

  }


  if(!links.length){

    alert(
      "目前没有链接可以导出。"
    );

    return;

  }


  const rows =
    links.map(
      item => ({

        标题:
          item.title,

        URL:
          item.url,

        标签:
          item.tags.join(
            ", "
          ),

        状态:
          getStatusText(
            item.status
          ),

        检测结果:
          item.statusMessage,

        最后检测:
          item.lastChecked,

        备注:
          item.note,

        添加时间:
          new Date(
            item.createdAt
          ).toLocaleString(
            "zh-CN"
          )

      })
    );


  const worksheet =
    XLSX.utils.json_to_sheet(
      rows
    );


  const workbook =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "链接收藏"
  );


  XLSX.writeFile(
    workbook,
    "我的链接收藏.xlsx"
  );

}


/* =========================================================
   Excel 导入
========================================================= */

function importExcel(event){

  const file =
    event.target.files?.[0];


  if(!file){

    return;

  }


  if(
    typeof XLSX ===
    "undefined"
  ){

    alert(
      "Excel组件加载失败。"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const workbook =
          XLSX.read(
            e.target.result,
            {
              type:"array"
            }
          );


        const sheet =
          workbook.Sheets[
            workbook.SheetNames[0]
          ];


        const rows =
          XLSX.utils.sheet_to_json(
            sheet,
            {
              defval:""
            }
          );


        if(!rows.length){

          alert(
            "Excel中没有找到数据。"
          );

          return;

        }


        let count = 0;


        rows.forEach(
          row => {

            const title =
              String(
                row["标题"] ||
                row["名称"] ||
                row["title"] ||
                ""
              ).trim();


            const url =
              normalizeUrl(
                String(
                  row["URL"] ||
                  row["网址"] ||
                  row["链接"] ||
                  row["url"] ||
                  ""
                ).trim()
              );


            if(!url){

              return;

            }


            const tagText =
              String(
                row["标签"] ||
                row["tags"] ||
                ""
              );


            const tags =
              tagText

                .split(
                  /[,，;；|]+/
                )

                .map(
                  x =>
                    x.trim()
                )

                .filter(Boolean);


            let status =
              "unchecked";


            const statusText =
              String(
                row["状态"] ||
                ""
              );


            if(
              statusText.includes(
                "有效"
              )
            ){

              status =
                "valid";

            }

            else if(
              statusText.includes(
                "失效"
              )
            ){

              status =
                "invalid";

            }

            else if(
              statusText.includes(
                "无法"
              )
            ){

              status =
                "unknown";

            }


            links.unshift({

              id:
                generateId(),

              title:
                title ||
                url,

              url,

              tags,

              note:
                String(
                  row["备注"] ||
                  ""
                ),

              status,

              lastChecked:
                String(
                  row["最后检测"] ||
                  ""
                ),

              statusMessage:
                String(
                  row["检测结果"] ||
                  ""
                ),

              createdAt:
                Date.now() +
                count,

              updatedAt:
                Date.now()

            });


            count++;

          }
        );


        saveData();

        render();


        alert(
          `成功导入 ${count} 条链接。`
        );


      }catch(error){

        console.error(
          error
        );

        alert(
          "Excel导入失败，请检查Excel格式。"
        );

      }

    };


  reader.readAsArrayBuffer(
    file
  );


  event.target.value =
    "";

}

  );

  );

/* =========================================================
   JSON导入
========================================================= */

function importJSON(event){

  const file =
    event.target.files?.[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !Array.isArray(data)
        ){

          throw new Error(
            "格式错误"
          );

        }


        if(
          !confirm(
            "恢复备份会覆盖当前链接数据，确定继续吗？"
          )
        ){

          return;

        }


        links =
          data.map(
            item =>
              normalizeLink(item)
          );


        saveData();

        render();


        alert(
          "JSON恢复成功。"
        );


      }catch(error){

        console.error(
          error
        );

        alert(
          "JSON文件格式不正确。"
        );

      }

    };


  reader.readAsText(
    file,
    "utf-8"
  );


  event.target.value =
    "";

}

}


/* =========================================================
   点击遮罩关闭弹窗
========================================================= */

document.addEventListener(
  "click",
  function(event){

    if(
      event.target.classList.contains(
        "modal"
      )
    ){

      event.target.classList.remove(
        "show"
      );

    }

  }
);

</script>

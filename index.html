<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>链接收藏夹 · 多标签 · 导入导出 · 失效检测</title>
    <!-- 引入样式库：Font Awesome 图标、SheetJS (XLSX)、Sortable (可选，但不用) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 使用 SheetJS 用于 Excel 导入导出 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app {
            width: 1200px;
            max-width: 100%;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .app-header {
            padding: 24px 28px 16px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-header h1 i {
            color: #3b82f6;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            background: #f1f5f9;
            color: #1e293b;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .btn:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-outline {
            background: white;
            border: 1px solid #cbd5e1;
        }
        .btn-outline:hover {
            background: #f8fafc;
        }
        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }
        .btn-danger:hover {
            background: #fecaca;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        .tabs-section {
            padding: 16px 28px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eef2f6;
        }
        .tab-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .tab-item {
            padding: 8px 16px;
            background: #f8fafc;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
            border: 1px solid transparent;
        }
        .tab-item.active {
            background: #3b82f6;
            color: white;
        }
        .tab-item i {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .tab-item .delete-tab {
            margin-left: 6px;
            font-size: 0.8rem;
            opacity: 0.6;
            transition: 0.2s;
            border-radius: 50%;
            padding: 2px;
        }
        .tab-item .delete-tab:hover {
            opacity: 1;
            background: rgba(255,255,255,0.3);
        }
        .tab-item:not(.active) .delete-tab:hover {
            background: #e2e8f0;
        }
        .tab-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .filter-bar {
            padding: 16px 28px;
            background: #f9fbfd;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #eef2f6;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #334155;
        }
        .filter-group select, .filter-group input {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 0.85rem;
            outline: none;
            transition: 0.2s;
        }
        .filter-group select:focus, .filter-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .stats {
            margin-left: auto;
            font-size: 0.85rem;
            color: #64748b;
            background: #eef2f6;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .link-table-container {
            padding: 0 28px 28px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 14px 8px 8px;
            color: #64748b;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .link-title {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .link-url {
            font-size: 0.8rem;
            color: #3b82f6;
            word-break: break-all;
            max-width: 300px;
            display: inline-block;
        }
        .tag-badge {
            background: #eef2ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .status-valid {
            background: #dcfce7;
            color: #166534;
        }
        .status-invalid {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-unknown {
            background: #f1f5f9;
            color: #475569;
        }
        .status-checking {
            background: #fef9c3;
            color: #854d0e;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .icon-btn:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .icon-btn.delete:hover {
            background: #fee2e2;
            color: #b91c1c;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #94a3b8;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 28px;
            max-width: 500px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
        }
        .modal h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .text-muted {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="app-header">
        <h1><i class="fas fa-link"></i> 链接收藏夹</h1>
        <div class="toolbar">
            <button class="btn btn-outline" id="importBtn"><i class="fas fa-file-import"></i> 导入Excel</button>
            <button class="btn btn-outline" id="exportBtn"><i class="fas fa-file-export"></i> 导出Excel</button>
            <button class="btn btn-primary" id="addLinkBtn"><i class="fas fa-plus"></i> 添加链接</button>
        </div>
    </div>

    <!-- 标签栏 -->
    <div class="tabs-section">
        <div class="tab-list" id="tabList">
            <!-- 动态渲染标签 -->
        </div>
        <div class="tab-actions">
            <button class="btn btn-sm btn-outline" id="addTabBtn"><i class="fas fa-folder-plus"></i> 新建标签</button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
        <div class="filter-group">
            <i class="fas fa-filter" style="color:#94a3b8;"></i>
            <select id="statusFilter">
                <option value="all">全部状态</option>
                <option value="valid">✅ 有效</option>
                <option value="invalid">❌ 失效</option>
                <option value="unknown">❓ 未检测</option>
            </select>
        </div>
        <div class="filter-group">
            <i class="fas fa-search" style="color:#94a3b8;"></i>
            <input type="text" id="searchInput" placeholder="搜索标题或链接...">
        </div>
        <button class="btn btn-sm btn-outline" id="checkAllBtn"><i class="fas fa-sync-alt"></i> 检测当前标签链接</button>
        <div class="stats" id="statsDisplay">共 0 条链接</div>
    </div>

    <!-- 链接表格 -->
    <div class="link-table-container">
        <table>
            <thead>
                <tr>
                    <th>标题 / 链接</th>
                    <th>标签</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="linkTableBody">
                <!-- 动态渲染 -->
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-link"></i>
            <p>还没有收藏链接，点击“添加链接”开始吧</p>
        </div>
    </div>
</div>

<!-- 添加/编辑链接弹窗 -->
<div class="modal-overlay" id="linkModal">
    <div class="modal">
        <h2 id="modalTitle">添加链接</h2>
        <input type="hidden" id="editLinkId" value="">
        <div class="form-group">
            <label>标题</label>
            <input type="text" id="linkTitleInput" placeholder="例如：GitHub">
        </div>
        <div class="form-group">
            <label>URL</label>
            <input type="url" id="linkUrlInput" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>所属标签</label>
            <select id="linkTagSelect"></select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="cancelLinkBtn">取消</button>
            <button class="btn btn-primary" id="saveLinkBtn">保存</button>
        </div>
    </div>
</div>

<!-- 新建标签弹窗 -->
<div class="modal-overlay" id="tabModal">
    <div class="modal">
        <h2>新建标签</h2>
        <div class="form-group">
            <label>标签名称</label>
            <input type="text" id="tabNameInput" placeholder="例如：工作、学习、娱乐">
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="cancelTabBtn">取消</button>
            <button class="btn btn-primary" id="saveTabBtn">创建</button>
        </div>
    </div>
</div>

<!-- 隐藏的文件输入，用于导入 Excel -->
<input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;">

<!-- 提示浮层 -->
<div class="toast" id="toast"></div>

<script>
    (function() {
        // ---------- 核心数据结构 ----------
        // 链接: { id, title, url, tag, status: 'unknown' | 'valid' | 'invalid' }
        // 标签: ['默认', '工作', ...]
        let links = [];
        let tags = ['默认', '工作', '学习'];
        let activeTag = '默认';         // 当前选中的标签名

        // 筛选条件
        let filterStatus = 'all';
        let searchKeyword = '';

        // 状态检测进行中集合 (用于避免重复检测同一链接)
        const checkingSet = new Set();

        // ---------- 初始化 & 本地存储 ----------
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('link_collector_data');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.links && Array.isArray(data.links)) links = data.links;
                    if (data.tags && Array.isArray(data.tags) && data.tags.length) tags = data.tags;
                    if (data.activeTag && tags.includes(data.activeTag)) activeTag = data.activeTag;
                } catch (e) { console.warn('解析存储失败', e); }
            }
            // 确保每个链接都有status字段（旧数据兼容）
            links.forEach(link => {
                if (!link.status) link.status = 'unknown';
            });
            // 确保标签唯一且默认标签存在
            if (!tags.includes('默认')) tags.unshift('默认');
            tags = [...new Set(tags)];
            if (!tags.includes(activeTag)) activeTag = tags[0];
        }

        function saveToLocalStorage() {
            const data = {
                links,
                tags,
                activeTag
            };
            localStorage.setItem('link_collector_data', JSON.stringify(data));
        }

        // ---------- 工具函数 ----------
        function generateId() {
            return Date.now() + Math.random().toString(36).substring(2, 10);
        }

        function showToast(msg, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // 获取当前标签下的链接 (未筛选前)
        function getLinksByActiveTag() {
            return links.filter(link => link.tag === activeTag);
        }

        // 获取经过筛选的链接（先按标签，再按状态+关键词）
        function getFilteredLinks() {
            let filtered = getLinksByActiveTag();
            // 状态筛选
            if (filterStatus !== 'all') {
                filtered = filtered.filter(link => link.status === filterStatus);
            }
            // 关键词搜索 (标题或url)
            if (searchKeyword.trim() !== '') {
                const kw = searchKeyword.trim().toLowerCase();
                filtered = filtered.filter(link =>
                    link.title.toLowerCase().includes(kw) || link.url.toLowerCase().includes(kw)
                );
            }
            return filtered;
        }

        // ---------- 渲染 ----------
        function renderTabs() {
            const tabList = document.getElementById('tabList');
            tabList.innerHTML = '';
            tags.forEach(tag => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab-item ${tag === activeTag ? 'active' : ''}`;
                tabEl.dataset.tag = tag;

                const tagNameSpan = document.createElement('span');
                tagNameSpan.textContent = tag;
                tabEl.appendChild(tagNameSpan);

                // 除了默认标签，其他可以删除（防止删光，至少保留一个标签）
                if (tags.length > 1) {
                    const delIcon = document.createElement('i');
                    delIcon.className = 'fas fa-times delete-tab';
                    delIcon.title = '删除标签';
                    delIcon.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteTag(tag);
                    });
                    tabEl.appendChild(delIcon);
                }

                tabEl.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-tab')) return;
                    if (activeTag !== tag) {
                        activeTag = tag;
                        saveToLocalStorage();
                        renderAll();
                    }
                });
                tabList.appendChild(tabEl);
            });
        }

        // 删除标签（同时删除该标签下的所有链接，或转移到默认？根据用户预期，通常删除标签也删除链接? 但这里我们提供选项？为了简单，删除标签时，将该标签下的链接移动到默认标签）
        function deleteTag(tagToDelete) {
            if (tagToDelete === '默认') {
                showToast('默认标签不能删除');
                return;
            }
            if (tags.length <= 1) {
                showToast('至少保留一个标签');
                return;
            }
            if (!confirm(`删除标签“${tagToDelete}”？该标签下的链接将移动到“默认”标签。`)) return;

            // 将该标签下的链接移动到默认标签
            links.forEach(link => {
                if (link.tag === tagToDelete) link.tag = '默认';
            });
            // 移除标签
            tags = tags.filter(t => t !== tagToDelete);
            if (activeTag === tagToDelete) activeTag = '默认';
            saveToLocalStorage();
            renderAll();
            showToast(`标签“${tagToDelete}”已删除`);
        }

        // 渲染链接表格
        function renderLinks() {
            const tbody = document.getElementById('linkTableBody');
            const emptyState = document.getElementById('emptyState');
            const filtered = getFilteredLinks();

            // 更新统计
            const totalInTag = getLinksByActiveTag().length;
            document.getElementById('statsDisplay').textContent = `共 ${totalInTag} 条链接 · 显示 ${filtered.length} 条`;

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            tbody.innerHTML = '';

            filtered.forEach(link => {
                const tr = document.createElement('tr');

                // 标题 & URL
                const tdTitle = document.createElement('td');
                const titleDiv = document.createElement('div');
                titleDiv.className = 'link-title';
                titleDiv.textContent = link.title || '(无标题)';
                const urlDiv = document.createElement('div');
                urlDiv.className = 'link-url';
                const urlLink = document.createElement('a');
                urlLink.href = link.url;
                urlLink.target = '_blank';
                urlLink.rel = 'noopener noreferrer';
                urlLink.textContent = link.url.length > 60 ? link.url.substring(0, 60) + '…' : link.url;
                urlDiv.appendChild(urlLink);
                tdTitle.appendChild(titleDiv);
                tdTitle.appendChild(urlDiv);
                tr.appendChild(tdTitle);

                // 标签
                const tdTag = document.createElement('td');
                const tagSpan = document.createElement('span');
                tagSpan.className = 'tag-badge';
                tagSpan.textContent = link.tag;
                tdTag.appendChild(tagSpan);
                tr.appendChild(tdTag);

                // 状态
                const tdStatus = document.createElement('td');
                const statusSpan = document.createElement('span');
                const status = link.status || 'unknown';
                statusSpan.className = `status-badge status-${status}`;
                let statusIcon = '';
                let statusText = '';
                if (status === 'valid') { statusIcon = '<i class="fas fa-check-circle"></i>'; statusText = '有效'; }
                else if (status === 'invalid') { statusIcon = '<i class="fas fa-exclamation-circle"></i>'; statusText = '失效'; }
                else if (status === 'checking') { statusIcon = '<i class="fas fa-spinner fa-pulse"></i>'; statusText = '检测中'; }
                else { statusIcon = '<i class="fas fa-question-circle"></i>'; statusText = '未检测'; }
                statusSpan.innerHTML = statusIcon + ' ' + statusText;
                tdStatus.appendChild(statusSpan);
                tr.appendChild(tdStatus);

                // 操作
                const tdAction = document.createElement('td');
                const actionDiv = document.createElement('div');
                actionDiv.className = 'action-btns';

                // 检测按钮
                const checkBtn = document.createElement('button');
                checkBtn.className = 'icon-btn';
                checkBtn.innerHTML = '<i class="fas fa-sync-alt"></i>';
                checkBtn.title = '检测链接有效性';
                checkBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    checkLinkValidity(link.id);
                });

                // 编辑按钮
                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn';
                editBtn.innerHTML = '<i class="fas fa-edit"></i>';
                editBtn.title = '编辑';
                editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLinkModal(link.id);
                });

                // 删除按钮
                const delBtn = document.createElement('button');
                delBtn.className = 'icon-btn delete';
                delBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                delBtn.title = '删除';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm(`确定删除链接“${link.title}”吗？`)) {
                        links = links.filter(l => l.id !== link.id);
                        saveToLocalStorage();
                        renderAll();
                        showToast('链接已删除');
                    }
                });

                actionDiv.appendChild(checkBtn);
                actionDiv.appendChild(editBtn);
                actionDiv.appendChild(delBtn);
                tdAction.appendChild(actionDiv);
                tr.appendChild(tdAction);

                tbody.appendChild(tr);
            });
        }

        function renderAll() {

            updateTagSelectOptions();

        // 更新弹窗中的标签下拉框
        function updateTagSelectOptions() {
            const select = document.getElementById('linkTagSelect');
            select.innerHTML = '';
            tags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;

        }

        // ---------- 链接有效性检测 ----------
        async function checkLinkValidity(linkId) {
            const link = links.find(l => l.id === linkId);
            if (!link) return;
            if (checkingSet.has(linkId)) return; // 已在检测中

            // 标记为检测中
            checkingSet.add(linkId);
            link.status = 'checking';
            renderLinks();

            try {
                // 由于浏览器CORS限制，很多链接无法直接fetch。此处使用图片探测法作为回退策略。
                // 但为了更通用的检测，我们采用fetch + timeout + no-cors / 以及image探测
                // 实际实现：先尝试 fetch HEAD (可能被CORS阻止), 如果失败则用图片探测。
                let isValid = false;

                // 方案1: 尝试fetch (no-cors模式无法读取状态，但可以判断是否网络错误)
                // 更稳妥：使用图片加载探测，适用于大多数网页
                const checkByImage = () => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        let settled = false;
                        const timeout = setTimeout(() => {
                            if (!settled) {
                                settled = true;
                                img.src = ''; // 取消加载
                                resolve(false); // 超时认为失效
                            }
                        }, 5000);

                        img.onload = () => {
                            if (!settled) {
                                settled = true;
                                clearTimeout(timeout);
                                resolve(true);
                            }
                        };
                        img.onerror = () => {
                            if (!settled) {
                                settled = true;
                                clearTimeout(timeout);
                                resolve(false);
                            }
                        };
                        // 添加随机参数避免缓存
                        const separator = link.url.includes('?') ? '&' : '?';
                        img.src = link.url + separator + '_=' + Date.now();
                    });
                };

                // 尝试fetch，如果fetch成功(即使返回type是opaque)也视为有效？但opaque无法判断状态码。
                // 所以我们直接使用图片探测更可靠一些。
                // 但是有些链接不是图片，img.onerror会触发，这就可能误判。
                // 改进：同时尝试fetch HEAD (如果被CORS阻止，catch)，如果fetch返回ok或opaque且无网络错误，可视为有效。
                // 为了减少误判，采用组合策略：fetch HEAD 如果失败（catch）则回退到图片探测。
                // 但注意很多网址不允许跨域fetch，会抛错，这是正常的。
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    const response = await fetch(link.url, {
                        method: 'HEAD',
                        mode: 'no-cors',  // 避免CORS错误，但无法读取状态
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    // 如果没抛错，说明至少请求发出去了，no-cors下response.type可能是opaque，认为有效
                    // 但也有可能服务器拒绝，但no-cors下我们无法知道，暂且认为有效(误报比漏报好)
                    isValid = true;
                } catch (fetchErr) {
                    // fetch失败（网络错误、超时、CORS等），回退到图片探测
                    console.warn('fetch检测失败，尝试图片探测:', fetchErr);
                    isValid = await checkByImage();
                }

                // 更新状态
                link.status = isValid ? 'valid' : 'invalid';
            } catch (e) {
                console.error('检测出错', e);
                link.status = 'invalid';
            } finally {
                checkingSet.delete(linkId);
                saveToLocalStorage();
                renderLinks();
            }
        }

        // 检测当前标签下所有链接
        async function checkAllInActiveTag() {
            const tagLinks = getLinksByActiveTag();
            if (tagLinks.length === 0) {
                showToast('当前标签下没有链接');
                return;
            }
            showToast(`开始检测 ${tagLinks.length} 个链接...`);
            // 逐个检测(避免并发过多)，但为了速度，使用Promise.all并控制并发数量(简单起见直接全部触发，但内部有set防重复)
            const promises = tagLinks.map(link => checkLinkValidity(link.id));
            await Promise.all(promises);
            showToast('检测完成');
            renderLinks();
        }

        // ---------- 模态框逻辑 ----------
        const linkModal = document.getElementById('linkModal');
        const tabModal = document.getElementById('tabModal');
        const modalTitle = document.getElementById('modalTitle');
        const editLinkIdInput = document.getElementById('editLinkId');
        const linkTitleInput = document.getElementById('linkTitleInput');
        const linkUrlInput = document.getElementById('linkUrlInput');
        const linkTagSelect = document.getElementById('linkTagSelect');

        function openLinkModal(editId = null) {
            updateTagSelectOptions();
            if (editId) {
                const link = links.find(l => l.id === editId);
                if (!link) return;
                modalTitle.textContent = '编辑链接';
                editLinkIdInput.value = link.id;
                linkTitleInput.value = link.title;
                linkUrlInput.value = link.url;
                linkTagSelect.value = link.tag;
            } else {
                modalTitle.textContent = '添加链接';
                editLinkIdInput.value = '';
                linkTitleInput.value = '';
                linkUrlInput.value = '';
                linkTagSelect.value = activeTag; // 默认当前标签
            }
            linkModal.classList.add('show');
        }

        function closeLinkModal() {
            linkModal.classList.remove('show');
        }

        // 保存链接
        function saveLink() {
            const title = linkTitleInput.value.trim();
            const url = linkUrlInput.value.trim();
            const tag = linkTagSelect.value;
            if (!title || !url) {
                showToast('标题和URL不能为空');
                return;
            }
            // 简单URL校验
            if (!/^https?:\/\/.+/i.test(url)) {
                showToast('请输入有效的URL (以http://或https://开头)');
                return;
            }

            const editId = editLinkIdInput.value;
            if (editId) {
                // 编辑
                const link = links.find(l => l.id === editId);
                if (link) {
                    link.title = title;
                    link.url = url;
                    link.tag = tag;
                    // 修改后状态重置为未知
                    link.status = 'unknown';
                }
            } else {
                // 新增
                const newLink = {
                    id: generateId(),
                    title,
                    url,
                    tag,
                    status: 'unknown'
                };
                links.push(newLink);
            }
            // 如果添加时选择了新标签但标签不存在？但下拉框来自现有标签，所以安全。
            saveToLocalStorage();
            closeLinkModal();
            renderAll();
            showToast(editId ? '链接已更新' : '链接已添加');
        }

        // 新建标签
        function openTabModal() {
            document.getElementById('tabNameInput').value = '';
            tabModal.classList.add('show');
        }

        function closeTabModal() {
            tabModal.classList.remove('show');
        }

        function createNewTag() {
            const name = document.getElementById('tabNameInput').value.trim();
            if (!name) {
                showToast('请输入标签名称');
                return;
            }
            if (tags.includes(name)) {
                showToast('标签已存在');
                return;
            }
            tags.push(name);
            activeTag = name; // 切换到新标签
            saveToLocalStorage();
            closeTabModal();
            renderAll();
            showToast(`标签“${name}”已创建`);
        }

        // ---------- Excel 导入导出 ----------
        function exportToExcel() {
            // 导出所有链接，不限于当前标签
            if (links.length === 0) {
                showToast('没有链接可导出');
                return;
            }
            const data = links.map(link => ({
                '标题': link.title,
                'URL': link.url,
                '标签': link.tag,
                '状态': link.status === 'valid' ? '有效' : (link.status === 'invalid' ? '失效' : '未检测')
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '链接收藏');
            XLSX.writeFile(wb, `链接收藏_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast('导出成功');
        }

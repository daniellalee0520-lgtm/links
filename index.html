<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接收藏夹 · 多标签 · 导入导出 · 失效检测</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
body { background: #f5f7fb; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
.app { width: 1200px; max-width: 100%; background: #fff; border-radius: 24px; box-shadow: 0 20px 40px -12px rgba(0,0,0,.15); overflow: hidden; display: flex; flex-direction: column; }
.app-header { padding: 22px 28px 16px; border-bottom: 1px solid #eef2f6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.app-header h1 { font-size: 1.6rem; font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 10px; }
.app-header h1 i { color: #3b82f6; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: none; background: #f1f5f9; color: #1e293b; padding: 8px 16px; border-radius: 40px; font-weight: 500; font-size: .88rem; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: .2s; border: 1px solid transparent; }
.btn:hover { background: #e2e8f0; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-outline { background: #fff; border: 1px solid #cbd5e1; }
.btn-outline:hover { background: #f8fafc; }
.btn-sm { padding: 6px 12px; font-size: .8rem; }
.tabs-section { padding: 14px 28px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #eef2f6; }
.tab-list { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.tab-item { padding: 7px 14px; background: #f8fafc; border-radius: 30px; font-size: .88rem; font-weight: 500; color: #475569; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: .15s; border: 1px solid transparent; user-select: none; }
.tab-item.active { background: #3b82f6; color: #fff; }
.tab-item .delete-tab { font-size: .75rem; opacity: .6; padding: 2px 4px; border-radius: 50%; }
.tab-item .delete-tab:hover { opacity: 1; background: rgba(0,0,0,.1); }
.tab-item.active .delete-tab:hover { background: rgba(255,255,255,.3); }
.tab-actions { display: flex; gap: 6px; margin-left: auto; padding-bottom: 10px; }
.filter-bar { padding: 14px 28px; background: #f9fbfd; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; border-bottom: 1px solid #eef2f6; }
.filter-group { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: #334155; }
.filter-group select, .filter-group input { padding: 6px 12px; border-radius: 30px; border: 1px solid #cbd5e1; background: #fff; font-size: .85rem; outline: none; }
.filter-group select:focus, .filter-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.stats { margin-left: auto; font-size: .82rem; color: #64748b; background: #eef2f6; padding: 5px 12px; border-radius: 30px; }
.link-table-container { padding: 0 28px 28px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: left; padding: 14px 8px 10px; color: #64748b; font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e2e8f0; }
td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
.link-title { font-weight: 600; color: #0f172a; margin-bottom: 4px; }
.link-url { font-size: .78rem; word-break: break-all; }
.link-url a { color: #3b82f6; text-decoration: none; }
.link-url a:hover { text-decoration: underline; }
.tag-badge { background: #eef2ff; color: #4338ca; padding: 3px 10px; border-radius: 30px; font-size: .72rem; font-weight: 500; white-space: nowrap; }
.status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 30px; font-size: .72rem; font-weight: 500; white-space: nowrap; }
.status-valid { background: #dcfce7; color: #166534; }
.status-invalid { background: #fee2e2; color: #991b1b; }
.status-unknown { background: #f1f5f9; color: #475569; }
.status-checking { background: #fef9c3; color: #854d0e; }
.action-btns { display: flex; gap: 4px; }
.icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; padding: 6px 8px; border-radius: 8px; transition: .2s; font-size: .9rem; }
.icon-btn:hover { background: #f1f5f9; color: #1e293b; }
.icon-btn.delete:hover { background: #fee2e2; color: #b91c1c; }
.empty-state { text-align: center; padding: 48px 24px; color: #94a3b8; }
.empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: .5; display: block; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 20px; max-width: 480px; width: 100%; padding: 26px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.3); }
.modal h2 { font-size: 1.3rem; margin-bottom: 18px; color: #0f172a; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: .82rem; font-weight: 500; color: #334155; margin-bottom: 6px; }
.form-group input, .form-group select { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: .9rem; outline: none; }
.form-group input:focus, .form-group select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 12px 24px; border-radius: 40px; font-size: .88rem; z-index: 2000; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1><i class="fas fa-link"></i> 链接收藏夹</h1>
    <div class="toolbar">
      <button class="btn btn-outline" iddiv="importBtn"><i class="fas fa-file-import"></i> 导入Excel</button>
      <button class="btn btn-outline" id="exportBtn"><i class="fas fa-file-export"></i> 导出Excel</button>
      <button class="btn btn-primary" id="addLinkBtn"><i class="fas fa-plus"></i> 添加链接</button>
    </div>
  </div>

  <div class="tabs-section">
    <div class="tab-list" id="tabList"></div>
    <div class="tab-actions">
      <button class="btn btn-sm btn-outline" id="addTabBtn"><i class="fas fa-folder-plus"></i> 新建标签</button>
    </>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <i class="fas fa-filter" style="color:#94a3b8;"></i>
      <select id="statusFilter">
        <option value="all">全部状态</option>
        <option value="valid">✅ 有效</option>
        <option value="invalid">❌ 失效</option>
        <option value="unknown">❓ 未检测</option>
      </select>
    </div>
    <div class="filter-group">
      <i class="fas fa-search" style="color:#94a3b8;"></i>
      <input type="text" id="searchInput" placeholder="搜索标题或链接...">
    </div>
    <button class="btn btn-sm btn-outline" id="checkAllBtn"><i class="fas fa-sync-alt"></i> 检测当前标签</button>
    <div class="stats" id="statsDisplay">共 0 条链接</div>
  </div>

  <div class="link-table-container">
    <table>
      <thead>
        <tr>
          <th>标题 / 链接</th>
          <th>标签</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="linkTableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <i class="fas fa-link"></i>
      <p>还没有收藏链接，点击“添加链接”开始吧</p>
    </div>
  </div>
</div>

<!-- 添加/编辑链接弹窗 -->
<div class="modal-overlay" id="linkModal">
  <div class="modal">
    <h2 id="modalTitle">添加链接</h2>
    <input type="hidden" id="editLinkId" value="">
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="linkTitleInput" placeholder="例如：GitHub">
    </div>
    <div class="form-group">
      <label>URL</label>
      <input type="url" id="linkUrlInput" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>所属标签</label>
      <select id="linkTagSelect"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelLinkBtn">取消</button>
      <button class="btn btn-primary" id="saveLinkBtn">保存</button>
    </div>
  </div>
</div>

<!-- 新建标签弹窗 -->
<div class="modal-overlay" id="tabModal">
  <div class="modal">
    <h2>新建标签</h2>
    <div class="form-group">
      <label>标签名称</label>
      <input type="text" id="tabNameInput" placeholder="例如：工作、学习、娱乐">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="cancelTabBtn">取消</button>
      <button class="btn btn-primary" id="saveTabBtn">创建</button>
    </div>
  </div>
</div>

<input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display:none;">
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ====== 数据 ======
  let links = [];      // {id,title,url,tag,status}
  let tags = ['默认','工作','学习'];
  let activeTag = '默认';
  let filterStatus = 'all';
  let searchKeyword = '';
  const checkingSet = new Set();

  // ====== 工具 ======
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function $(id){ return document.getElementById(id); }
  function showToast(msg, ms){
    ms = ms || 2000;
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), ms);
  }
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ====== 存储 ======
  function save(){
    try {
      localStorage.setItem('link_collector_v2', JSON.stringify({links, tags, activeTag}));
    } catch(e){ console.warn(e); }
  }
  function load(){
    try {
      const raw = localStorage.getItem('link_collector_v2');
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.links)) links = d.links;
      if (Array.isArray(d.tags) && d.tags.length) tags = d.tags;
      if (d.activeTag && tags.includes(d.activeTag)) activeTag = d.activeTag;
    } catch(e){ console.warn(e); }
    links.forEach(l => { if (!l.status) l.status = 'unknown'; });
    if (!tags.includes('默认')) tags.unshift('默认');
    tags = Array.from(new Set(tags));
    if (!tags.includes(activeTag)) activeTag = tags[0];
  }

  // ====== 数据筛选 ======
  function linksInActiveTag(){
    return links.filter(l => l.tag === activeTag);
  }
  function filteredLinks(){
    let arr = linksInActiveTag();
    if (filterStatus !== 'all') arr = arr.filter(l => l.status === filterStatus);
    const kw = searchKeyword.trim().toLowerCase();
    if (kw) arr = arr.filter(l =>
      (l.title||'').toLowerCase().includes(kw) || (l.url||'').toLowerCase().includes(kw)
    );
    return arr;
  }

  // ====== 渲染标签 ======
  function renderTabs(){
    const box = $('tabList');
    box.innerHTML = '';
    tags.forEach(tag => {
      const el = document.createElement('div');
      el.className = 'tab-item' + (tag === activeTag ? ' active' : '');
      const span = document.createElement('span');
      span.textContent = tag;
      el.appendChild(span);

      if (tags.length > 1){
        const del = document.createElement('i');
        del.className = 'fas fa-times delete-tab';
        del.title = '删除标签';
        del.addEventListener('click', (e)=>{
          e.stopPropagation();
          deleteTag(tag);
        });
        el.appendChild(del);
      }
      el.addEventListener('click', ()=>{
        if (activeTag !== tag){
          activeTag = tag;
          save();
          renderAll();
        }
      });
      box.appendChild(el);
    });
  }

  function deleteTag(tag){
    if (tag === '默认'){ showToast('默认标签不能删除'); return; }
    if (!confirm('删除标签「' + tag + '」？该标签下的链接会移到「默认」。')) return;
    links.forEach(l => { if (l.tag === tag) l.tag = '默认'; });
    tags = tags.filter(t => t !== tag);
    if (activeTag === tag) activeTag = '默认';
    save();
    renderAll();
    showToast('已删除标签');
  }

  // ====== 渲染链接表格 ======
  function renderLinks(){
    const tbody = $('linkTableBody');
    const empty = $('emptyState');
    const list = filteredLinks();
    const total = linksInActiveTag().length;

    $('statsDisplay').textContent = '共 ' + total + ' 条 · 显示 ' + list.length + ' 条';

    if (!list.length){
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    let html = '';
    list.forEach(l => {
      let statusHtml = '';
      const st = l.status || 'unknown';
      if (st === 'valid') statusHtml = '<span class="status-badge status-valid"><i class="fas fa-check-circle"></i> 有效</span>';
      else if (st === 'invalid') statusHtml = '<span class="status-badge status-invalid"><i class="fas fa-exclamation-circle"></i> 失效</span>';
      else if (st === 'checking') statusHtml = '<span class="status-badge status-checking"><i class="fas fa-spinner fa-pulse"></i> 检测中</span>';
      else statusHtml = '<span class="status-badge status-unknown"><i class="fas fa-question-circle"></i> 未检测</span>';

      const urlShow = l.url && l.url.length > 60 ? l.url.slice(0,60) + '…' : (l.url || '');
      html += '<tr data-id="' + l.id + '">' +
        '<td>' +
          '<div class="link-title">' + escapeHtml(l.title || '(无标题)') + '</div>' +
          '<div class="link-url"><a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(urlShow) + '</a></div>' +
        '</td>' +
        '<td><span class="tag-badge">' + escapeHtml(l.tag) + '</span></td>' +
        '<td>' + statusHtml + '</td>' +
        '<td>' +
          '<div class="action-btns">' +
            '<button class="icon-btn" data-act="check" title="检测"><i class="fas fa-sync-alt"></i></button>' +
            '<button class="icon-btn" data-act="edit" title="编辑"><i class="fas fa-edit"></i></button>' +
            '<button class="icon-btn delete" data-act="del" title="删除"><i class="fas fa-trash-alt"></i></button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    });
    tbody.innerHTML = html;

    // 事件代理
    tbody.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const tr = btn.closest('tr');
        const id = tr.dataset.id;
        const act = btn.dataset.act;
        if (act === 'check') checkLink(id);
        else if (act === 'edit') openLinkModal(id);
        else if (act === 'del'){
          if (confirm('确定删除这条链接吗？')){
            links = links.filter(x => x.id !== id);
            save();
            renderAll();
            showToast('已删除');
          }
        }
      });
    });
  }

  function renderAll(){
    renderTabs();
    renderLinks();
    updateTagSelect();
  }

  // ====== 标签下拉 ======
  function updateTagSelect(){
    const sel = $('linkTagSelect');
    sel.innerHTML = '';
    tags.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      sel.appendChild(o);
    });
  }

  // ====== 检测有效性 ======
  // 使用图片探测法：对于大多数网页，能加载一个img的onload（或onerror但服务器有响应）很难判断。
  // 更稳妥的做法：用 fetch no-cors 尝试请求，只要没抛网络错误（含超时）就视为有效。
  // 缺点：对不存在的域名，fetch会快速抛错，视为失效。
  async function checkLink(id){
    const link = links.find(l => l.id === id);
    if (!link || checkingSet.has(id)) return;
    checkingSet.add(id);

    const oldStatus = link.status;
    link.status = 'checking';
    renderLinks();

    let ok = false;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 6000);
      await fetch(link.url, { method:'GET', mode:'no-cors', signal: ctrl.signal, cache:'no-store' });
      clearTimeout(timer);
      ok = true; // 没抛错（含abort之外）就视为可达
    } catch(err){
      // abort 或网络错误
      ok = false;
    }

    link.status = ok ? 'valid' : 'invalid';
    checkingSet.delete(id);
    save();
    renderLinks();
    if (oldStatus !== link.status){
      // 静默更新，无需toast
    }
  }

  async function checkAllActiveTag(){
    const list = linksInActiveTag();
    if (!list.length){ showToast('当前标签下没有链接'); return; }
    showToast('开始检测 ' + list.length + ' 条链接…', 1500);
    // 限制并发 5 个
    const queue = list.slice();
    const workers = [];
    const CONCURRENCY = 5;
    for (let i = 0; i < CONCURRENCY; i++){
      workers.push((async ()=>{
        while (queue.length){
          const item = queue.shift();
          await checkLink(item.id);
        }
      })());
    }
    await Promise.all(workers);
    showToast('检测完成');
  }

  // ====== 模态框：链接 ======
  function openLinkModal(id){
    updateTagSelect();
    const modal = $('linkModal');
    if (id){
      const l = links.find(x => x.id === id);
      if (!l) return;
      $('modalTitle').textContent = '编辑链接';
      $('editLinkId').value = l.id;
      $('linkTitleInput').value = l.title;
      $('linkUrlInput').value = l.url;
      $('linkTagSelect').value = l.tag;
    } else {
      $('modalTitle').textContent = '添加链接';
      $('editLinkId').value = '';
      $('linkTitleInput').value = '';
      $('linkUrlInput').value = '';
      $('linkTagSelect').value = activeTag;
    }
    modal.classList.add('show');
    setTimeout(()=>$('linkTitleInput').focus(), 50);
  }
  function closeLinkModal(){ $('linkModal').classList.remove('show'); }

  function saveLink(){
    const title = $('linkTitleInput').value.trim();
    const url = $('linkUrlInput').value.trim();
    const tag = $('linkTagSelect').value;
    if (!title){ showToast('请输入标题'); return; }
    if (!url){ showToast('请输入URL'); return; }
    if (!/^https?:\/\//i.test(url)){ showToast('URL需以 http:// 或 https:// 开头'); return; }

    const editId = $('editLinkId').value;
    if (editId){
      const l = links.find(x => x.id === editId);
      if (l){
        l.title = title; l.url = url; l.tag = tag; l.status = 'unknown';
      }
    } else {
      links.push({ id: uid(), title, url, tag, status:'unknown' });
    }
    save();
    closeLinkModal();
    renderAll();
    showToast(editId ? '已更新' : '已添加');
  }

  // ====== 模态框：标签 ======
  function openTabModal(){
    $('tabNameInput').value = '';
    $('tabModal').classList.add('show');
    setTimeout(()=>$('tabNameInput').focus(), 50);
  }
  function closeTabModal(){ $('tabModal').classList.remove('show'); }
  function saveTab(){
    const name = $('tabNameInput').value.trim();
    if (!name){ showToast('请输入标签名'); return; }
    if (tags.includes(name)){ showToast('标签已存在'); return; }
    tags.push(name);
    activeTag = name;
    save();
    closeTabModal();
    renderAll();
    showToast('已创建标签：' + name);
  }

  // ====== Excel 导入导出 ======
  function exportExcel(){
    if (!links.length){ showToast('没有数据可导出'); return; }
    const data = links.map(l => ({
      '标题': l.title || '',
      'URL': l.url || '',
      '标签': l.tag || '',
      '状态': l.status === 'valid' ? '有效' : (l.status === 'invalid' ? '失效' : '未检测')
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '链接收藏');
    const fname = '链接收藏_' + new Date().toISOString().slice(0,10) + '.xlsx';
    XLSX.writeFile(wb, fname);
    showToast('已导出');
  }

  function importExcel(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type:'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
        if (rows.length < 2){ showToast('文件内容为空'); return; }

        // 找表头
        const header = rows[0].map(h => String(h).trim());
        const idxTitle = header.findIndex(h => /标题|title|name/i.test(h));
        const idxUrl = header.findIndex(h => /url|链接|网址|link/i.test(h));
        const idxTag = header.findIndex(h => /标签|tag|分类|category/i.test(h));

        if (idxUrl < 0 && idxTitle < 0){ showToast('未找到标题/URL列'); return; }

        let count = 0;
        for (let i = 1; i < rows.length; i++){
          const row = rows[i];
          if (!row || !row.length) continue;
          const title = idxTitle >= 0 ? String(row[idxTitle] || '').trim() : '';
          const url = idxUrl >= 0 ? String(row[idxUrl] || '').trim() : '';
          const tagRaw = idxTag >= 0 ? String(row[idxTag] || '').trim() : '';
          if (!url && !title) continue;
          const tag = tags.includes(tagRaw) ? tagRaw : (tagRaw || '默认');
          if (!tags.includes(tag)) tags.push(tag);
          links.push({
            id: uid(),
            title: title || url || '未命名',
            url: url,
            tag: tag,
            status: 'unknown'
          });
          count++;
        }
        if (!tags.includes('默认')) tags.unshift('默认');
        save();
        renderAll();
        showToast('成功导入 ' + count + ' 条');
      } catch(err){
        console.error(err);
        showToast('导入失败：' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ====== 事件绑定 ======
  function bindEvents(){
    $('addLinkBtn').addEventListener('click', ()=>openLinkModal(null));
    $('importBtn').addEventListener('click', ()=>$('excelFileInput').click());
    $('exportBtn').addEventListener('click', exportExcel);
    $('addTabBtn').addEventListener('click', openTabModal);
    $('checkAllBtn').addEventListener('click', checkAllActiveTag);

    $('saveLinkBtn').addEventListener('click', saveLink);
    $('cancelLinkBtn').addEventListener('click', closeLinkModal);

    $('saveTabBtn').addEventListener('click', saveTab);
    $('cancelTabBtn').addEventListener('click', closeTabModal);

    $('excelFileInput').addEventListener('change', (e)=>{
      const f = e.target.files && e.target.files[0];
      if (f) importExcel(f);
      e.target.value = '';
    });

    $('statusFilter').addEventListener('change', (e)=>{
      filterStatus = e.target.value;
      renderLinks();
    });
    $('searchInput').addEventListener('input', (e)=>{
      searchKeyword = e.target.value;
      renderLinks();
    });

    // 点击遮罩关闭
    ['linkModal','tabModal'].forEach(id=>{
      $(id).addEventListener('click', (e)=>{
        if (e.target.id === id) $(id).classList.remove('show');
      });
    });

    // Enter 提交
    document.addEventListener('keydown', (e)=>{
      if (e.key !== 'Enter') return;
      if ($('linkModal').classList.contains('show')){ saveLink(); }
      else if ($('tabModal').classList.contains('show')){ saveTab(); }
    });
  }

  // ====== 启动 ======
  load();
  bindEvents();
  renderAll();

  // 首次使用给个示例
  if (links.length === 0){
    links.push(
      { id: uid(), title:'GitHub', url:'https://github.com', tag:'工作', status:'unknown' },
      { id: uid(), title:'MDN Web Docs', url:'https://developer.mozilla.org', tag:'学习', status:'unknown' },
      { id: uid(), title:'这个域名一定不存在12345', url:'https://this-domain-should-not-exist-987654321.com', tag:'默认', status:'unknown' }
    );
    save();
    renderAll();
  }
})();
</script>
</body>
</html>
